[pytest]
testpaths = tests
# La racine du projet doit etre importable : les tests font « from mvc… ».
# Sans cette ligne, `python -m pytest` passe (il insere le repertoire courant
# dans sys.path) mais le script `pytest` echoue, et c'est celui que le Makefile
# lance. Un projet neuf echouait donc a son propre `make check`
# (SKELETON-PYTEST-PYTHONPATH-001).
pythonpath = .
addopts = --strict-markers
markers =
    meta: garde-fous de structure et de conventions du projet
    smoke: vérifie que l'application se charge (rapide, sans base de données)
    db: nécessite une base de données configurée
